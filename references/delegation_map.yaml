delegation_map:
  requirement_phase:
    owned_by: "flutter-forge"
    delegate_to: []
    rule: "需求理解属于项目与业务语义层，不委托官方 Flutter skills。"

  ui_parsing_phase:
    owned_by: "flutter-forge"
    delegate_to:
      - skill: "flutter-building-layouts"
        when:
          - "需要做多端响应式布局"
          - "页面结构强依赖约束系统"
    rule: "Flutter Forge 负责页面结构拆分；布局、约束和常见溢出类子问题优先参考官方 layout skill。"

  implementation_design_phase:
    owned_by: "flutter-forge"
    delegate_to:
      - skill: "flutter-architecting-apps"
        when:
          - "需要确定分层架构"
          - "需要做架构重构"
      - skill: "flutter-implementing-navigation-and-routing"
        when:
          - "需要新增或调整路由体系"
      - skill: "flutter-handling-http-and-json"
        when:
          - "需要新增模型序列化"
          - "需要设计 HTTP 接入方式"
      - skill: "flutter-localizing-apps"
        when:
          - "页面涉及多语言接入"
    rule: "官方 skill 提供通用蓝图；Flutter Forge 负责项目内落层、命名、复用和收口。"

  development_phase:
    owned_by: "flutter-forge"
    delegate_to:
      - skill: "flutter-testing-apps"
        when:
          - "新增可复用组件"
          - "新增明显交互行为"
          - "需要做多状态预览"
          - "涉及关键用户流程"
    rule: "页面开发阶段允许委托官方 skill 处理通用代码形态，但仍由 Flutter Forge 统一输出结构。"

  quality_phase:
    owned_by: "flutter-forge"
    delegate_to: []
    rule: "质量判断由 Flutter Forge 主导，测试实现可参考官方 skill。"
